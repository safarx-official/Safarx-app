<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SafarX - Commercial Transport & Logistics Super-App</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; height: 100vh; overflow-x: hidden; }

        /* SPLASH SCREEN ANIMATION */
        #splashScreen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: #0f172a; display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 9999; transition: opacity 0.6s ease;
        }
        
        .splash-logo-img {
            width: 140px; height: 140px; border-radius: 50%; object-fit: cover;
            box-shadow: 0 10px 25px rgba(59, 130, 246, 0.5); 
            margin-bottom: 25px; animation: pulseLogo 1.5s infinite alternate;
        }

        .splash-logo-container { display: flex; align-items: center; font-size: 40px; font-weight: bold; letter-spacing: 1px; }
        .text-safar { color: #ffffff; opacity: 0; transform: translateX(-60px); animation: slideInSafar 0.8s forwards ease-out; }
        .text-x { color: #3b82f6; opacity: 0; transform: translateX(60px) scale(0.4); animation: snapInX 0.8s 0.3s forwards cubic-bezier(0.175, 0.885, 0.32, 1.275); }

        @keyframes slideInSafar { to { opacity: 1; transform: translateX(0); } }
        @keyframes snapInX { to { opacity: 1; transform: translateX(0) scale(1); } }
        @keyframes pulseLogo { 0% { transform: scale(1); } 100% { transform: scale(1.05); } }

        /* SCREENS */
        .screen-box { display: none; justify-content: center; align-items: center; min-height: 100vh; background-color: #0f172a; padding: 20px; }
        .card { background-color: #1e293b; padding: 35px; border-radius: 16px; border: 1px solid #334155; width: 100%; max-width: 450px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .card h1 { font-size: 24px; color: #ffffff; margin-bottom: 5px; }
        .card p { color: #94a3b8; font-size: 13px; margin-bottom: 20px; }

        .btn-google {
            width: 100%; background-color: #ffffff; color: #1e2124; border: none; padding: 14px;
            font-size: 15px; font-weight: 600; border-radius: 8px; cursor: pointer; display: flex;
            align-items: center; justify-content: center; gap: 10px; margin-bottom: 10px; transition: background 0.2s;
        }
        .btn-google:hover { background-color: #f1f5f9; }
        
        .divider { display: flex; align-items: center; text-align: center; color: #64748b; font-size: 12px; margin: 15px 0; }
        .divider::before, .divider::after { content: ''; flex: 1; border-bottom: 1px solid #334155; }
        .divider::before { margin-right: .5em; }
        .divider::after { margin-left: .5em; }

        .input-group { text-align: left; margin-bottom: 12px; }
        .input-group label { font-size: 12px; color: #94a3b8; display: block; margin-bottom: 4px; }
        .input-box { width: 100%; padding: 12px; background-color: #0f172a; border: 1px solid #334155; color: #ffffff; border-radius: 8px; font-size: 14px; outline: none; }
        .input-box:focus { border-color: #3b82f6; }
        
        .btn-primary { width: 100%; background-color: #3b82f6; color: white; border: none; padding: 14px; font-size: 15px; font-weight: bold; border-radius: 8px; cursor: pointer; margin-top: 10px; transition: background 0.2s; }
        .btn-primary:hover { background-color: #2563eb; }

        .profile-avatar { width: 70px; height: 70px; border-radius: 50%; object-fit: cover; margin: 0 auto 15px auto; border: 2px solid #3b82f6; display: none; }
    </style>
</head>
<body>

    <!-- 1. SPLASH SCREEN -->
    <div id="splashScreen">
        <img src="logo.jpg" alt="SafarX Logo" class="splash-logo-img">
        <div class="splash-logo-container">
            <span class="text-safar">Safar</span><span class="text-x">X</span>
        </div>
    </div>

    <!-- 2. LOGIN SCREEN -->
    <div id="loginScreen" class="screen-box" style="display: flex;">
        <div class="card">
            <h1>SafarX</h1>
            <p>Commercial Logistics & Transport Super-App</p>
            
            <!-- Google Login Section with Inline Input -->
            <div class="input-group">
                <label>Google Account Email</label>
                <input type="email" id="googleEmailInput" class="input-box" placeholder="Enter your gmail address">
            </div>
            <button class="btn-google" onclick="handleGoogleLogin()">
                <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.63-.06-1.25-.19-1.84H9v3.49h4.84c-.21 1.12-.84 2.07-1.78 2.71v2.25h2.87c1.68-1.55 2.75-3.83 2.75-6.61z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.87-2.25c-.81.54-1.84.86-3.09.86-2.37 0-4.38-1.6-5.1-3.76H.88v2.33C2.38 15.96 5.42 18 9 18z"/><path fill="#FBBC05" d="M3.9 10.67c-.19-.54-.3-1.12-.3-1.72s.11-1.18.3-1.72V4.9H.88C.32 6.01 0 7.27 0 8.62s.32 2.61.88 3.72l3.02-1.67z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0 5.42 0 2.38 2.04.88 4.9l3.02 2.33c.72-2.16 2.73-3.65 5.1-3.65z"/></svg>
                Continue with Google
            </button>

            <div class="divider">OR</div>

            <div class="input-group">
                <label>Email Address</label>
                <input type="email" id="loginEmail" class="input-box" placeholder="name@example.com">
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="loginPassword" class="input-box" placeholder="••••••••">
            </div>
            <button class="btn-primary" onclick="handleEmailAuth()">Continue with Email</button>
        </div>
    </div>

    <!-- 3. PROFILE SETUP FORM SCREEN -->
    <div id="profileScreen" class="screen-box">
        <div class="card" style="max-width: 500px;">
            <img id="userAvatar" class="profile-avatar" src="" alt="Profile Photo">
            <h1>Complete Your Profile</h1>
            <p>Setup your commercial transporter details</p>

            <div class="input-group">
                <label>Full Name</label>
                <input type="text" id="fullName" class="input-box" placeholder="Enter your full name">
            </div>

            <div class="input-group">
                <label>Email Address</label>
                <input type="email" id="profileEmail" class="input-box" readonly style="opacity: 0.7;">
            </div>

            <div style="display: flex; gap: 10px;">
                <div class="input-group" style="flex: 1;">
                    <label>Pincode</label>
                    <input type="text" id="pincodeInput" class="input-box" placeholder="Enter 6-digit Pincode" maxlength="6" onkeyup="fetchLocationByPincode(this.value)">
                </div>
                <div class="input-group" style="flex: 1;">
                    <label>District</label>
                    <input type="text" id="districtInput" class="input-box" placeholder="Auto-fetched" readonly>
                </div>
            </div>

            <div class="input-group">
                <label>State</label>
                <input type="text" id="stateInput" class="input-box" placeholder="Auto-fetched" readonly>
            </div>

            <div class="input-group">
                <label>Permanent Address</label>
                <input type="text" id="permAddress" class="input-box" placeholder="Street, Landmark, Area">
            </div>

            <div style="display: flex; gap: 10px;">
                <div class="input-group" style="flex: 1;">
                    <label>Permanent Mobile Number</label>
                    <input type="tel" id="permMobile" class="input-box" placeholder="10-digit mobile" maxlength="10">
                </div>
                <div class="input-group" style="flex: 1;">
                    <label>Alternative Mobile Number</label>
                    <input type="tel" id="altMobile" class="input-box" placeholder="Optional" maxlength="10">
                </div>
            </div>

            <button class="btn-primary" onclick="submitProfileSetup()">Confirm & Go to Dashboard</button>
        </div>
    </div>

    <script>
        window.addEventListener('load', () => {
            setTimeout(() => {
                let splash = document.getElementById('splashScreen');
                splash.style.opacity = '0';
                setTimeout(() => { splash.style.display = 'none'; }, 600);
            }, 2500);
        });

        // Clean Google Login without annoying prompt box
        function handleGoogleLogin() {
            let userEmail = document.getElementById('googleEmailInput').value.trim();
            if(!userEmail || !userEmail.includes('@')) {
                alert("Please enter a valid Google email address.");
                return;
            }

            let userName = userEmail.split('@')[0].toUpperCase();
            
            document.getElementById('profileEmail').value = userEmail;
            document.getElementById('fullName').value = userName;
            
            let avatar = document.getElementById('userAvatar');
            avatar.src = "https://www.w3schools.com/howto/img_avatar.png";
            avatar.style.display = "block";

            switchToProfileScreen();
        }

        function handleEmailAuth() {
            let email = document.getElementById('loginEmail').value.trim();
            let pass = document.getElementById('loginPassword').value.trim();
            if(!email || !pass) {
                alert("Please enter both email and password.");
                return;
            }
            document.getElementById('profileEmail').value = email;
            switchToProfileScreen();
        }

        function switchToProfileScreen() {
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('profileScreen').style.display = 'flex';
        }

        async function fetchLocationByPincode(pincode) {
            if (pincode.length === 6) {
                try {
                    let response = await fetch(`https://api.postalpincode.in/pincode/${pincode}`);
                    let data = await response.json();
                    if (data[0].Status === "Success") {
                        let details = data[0].PostOffice[0];
                        document.getElementById('districtInput').value = details.District;
                        document.getElementById('stateInput').value = details.State;
                    } else {
                        document.getElementById('districtInput').value = "";
                        document.getElementById('stateInput').value = "";
                    }
                } catch (err) {
                    console.error("Error fetching pincode data", err);
                }
            } else {
                document.getElementById('districtInput').value = "";
                document.getElementById('stateInput').value = "";
            }
        }

        function submitProfileSetup() {
            let name = document.getElementById('fullName').value.trim();
            let pincode = document.getElementById('pincodeInput').value.trim();
            let address = document.getElementById('permAddress').value.trim();
            let mobile = document.getElementById('permMobile').value.trim();

            if(!name || !pincode || !address || !mobile) {
                alert("Please fill all required profile fields!");
                return;
            }
            alert("Profile setup complete! Welcome to SafarX Dashboard.");
        }
    </script>
</body>
</html>
